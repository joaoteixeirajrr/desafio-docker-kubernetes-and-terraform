# Postgres como StatefulSet + PVC (volumeClaimTemplates): o padrão correto para
# estado em Kubernetes. Se fosse Deployment efêmero, os recados sumiriam a cada
# restart. A senha vem do Secret via secretKeyRef (nunca hardcoded aqui).

# Service headless: StatefulSet precisa de identidade de rede estável.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mural.postgres.service" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mural.postgres.service" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "mural.postgres.service" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mural.labels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "mural.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mural.secret.name" . }}
                  key: postgres-password
            # Subdir evita problemas de permissão do PVC no lost+found.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          # readiness: só recebe tráfego quando o banco aceita conexões.
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          # liveness: reinicia se o processo travar (diferente da readiness).
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
