# Secret com a credencial do banco.
# A DATABASE_URL (que carrega a senha) e a senha do Postgres vivem AQUI,
# nunca em texto plano num Deployment ou ConfigMap. A API consome via
# secretKeyRef; o StatefulSet do Postgres consome a senha via secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.secret.name" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  # String de conexão completa consumida pela API (DATABASE_URL).
  database-url: {{ include "mural.databaseUrl" . | quote }}
  # Senha isolada, consumida pelo Postgres (POSTGRES_PASSWORD).
  postgres-password: {{ .Values.db.password | quote }}
